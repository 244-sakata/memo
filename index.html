<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff4f7">
<title>Shopping & Memo 💕</title>

<!-- 🍯 スマホのホーム画面用アイコン設定 -->
<link rel="icon" href="icon.jpg" type="image/jpeg">
<link rel="apple-touch-icon" href="icon.jpg">

<style>
:root{
  --bg:#fff7fa; --card:#fff; --pink:#ff7fa3; --pink2:#ffd9e4;
  --text:#4d3d43; --muted:#9b858d; --green:#73c99a; --line:#f1dce3;
  --danger:#ff6b8b;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,#fff8fb,#fff1f6);color:var(--text);
font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit}
.app{max-width:560px;margin:auto;padding:20px 16px 40px}
header{text-align:center;padding:10px 0 18px;position:relative}

/* 🐝 はちみつのまわりを飛ぶ演出 */
.honey-box{position:relative;display:inline-block;width:70px;height:70px;margin:0 auto;cursor:pointer}
.logo{font-size:40px;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;animation:float 3s ease-in-out infinite}
.bee{position:absolute;font-size:18px;pointer-events:none}
.bee1{animation:fly1 4s ease-in-out infinite}
.bee2{animation:fly2 3.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes fly1{
  0%{transform:translate(-24px, 10px) rotate(-10deg) scale(0.9)}
  50%{transform:translate(28px, -15px) rotate(15deg) scale(1.1)}
  100%{transform:translate(-24px, 10px) rotate(-10deg) scale(0.9)}
}
@keyframes fly2{
  0%{transform:translate(26px, 15px) rotate(10deg) scale(1)}
  50%{transform:translate(-22px, -12px) rotate(-15deg) scale(0.9)}
  100%{transform:translate(26px, 15px) rotate(10deg) scale(1)}
}

h1{margin:4px 0 3px;font-size:26px;letter-spacing:0.5px}
.sub{font-size:13px;color:var(--muted);font-weight:700}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tab{border:0;border-radius:16px;padding:12px 8px;background:white;box-shadow:0 4px 14px #e9cfd866;color:var(--text);font-weight:700;font-size:13px;cursor:pointer;transition:.2s}
.tab.active{background:var(--pink);color:white;box-shadow:0 4px 14px #ff7fa366}
.pages{display:grid;gap:11px}
.page{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
border-radius:20px;padding:15px;box-shadow:0 4px 14px #e9cfd84d;cursor:pointer;transition:.2s}
.page:hover{transform:translateY(-2px);box-shadow:0 6px 18px #e9cfd888}
.page .emoji{font-size:28px}
.page .pbody{flex:1;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.page .name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page small{color:var(--muted);font-size:11px}
.addPage{width:100%;margin-top:14px;background:#fff0f4;color:#d85c80;border:2px dashed #ffc0d2;border-radius:20px;padding:15px;font-weight:700;cursor:pointer;transition:.2s}
.addPage:hover{background:#ffe4ed}
.hidden{display:none!important}

/* 戻るボタンとタイトルをスッキリ配置 */
.topbar{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.topbar-row{display:flex;align-items:center;justify-content:space-between}
.topbar h2{margin:0;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px;flex:1}
.edit-title-btn{background:transparent;border:0;cursor:pointer;font-size:15px;padding:2px 6px;border-radius:6px}
.edit-title-btn:hover{background:#fff0f4}
.back{border:0;border-radius:14px;padding:8px 14px;background:white;box-shadow:0 2px 8px #e9cfd866;color:var(--text);font-weight:700;cursor:pointer;font-size:13px}
.page-actions{display:flex;gap:6px}
.icon-btn{border:0;background:#fff0f4;color:var(--danger);border-radius:12px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}

.card{background:white;border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 4px 14px #e9cfd84d}
.addrow{display:flex;gap:8px}.addrow input{flex:1;border:1px solid var(--line);border-radius:15px;padding:12px 13px;outline:none;background:#fffdfd}
.addrow input:focus{border-color:var(--pink)}
.addrow button{border:0;border-radius:15px;background:var(--pink);color:#fff;font-weight:800;padding:0 18px;cursor:pointer}
.list-header{display:flex;justify-content:space-between;align-items:center;margin:16px 4px 8px}
.list-header span{font-size:13px;color:var(--muted);font-weight:700}
.clear-btn{border:0;background:#f5eef1;color:var(--muted);border-radius:10px;padding:4px 10px;font-size:11px;cursor:pointer;font-weight:700}
.clear-btn:hover{background:var(--danger);color:white}
.items{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:11px;background:white;border:1px solid var(--line);border-radius:17px;padding:12px;transition:.2s}
.box{font-size:22px;cursor:pointer}
.itemmain{flex:1;cursor:pointer}.itemname{font-weight:700;font-size:16px}
.item-del{border:0;background:transparent;color:#ccb3bc;font-size:16px;cursor:pointer;padding:4px 8px;border-radius:8px}
.item-del:hover{color:var(--danger);background:#fff0f4}
.checked{opacity:.55}.checked .itemname{text-decoration:line-through;color:var(--muted)}
.note{width:100%;min-height:280px;border:1px solid var(--line);border-radius:18px;padding:14px;resize:vertical;outline:none;background:#fffdfd;font-size:15px;line-height:1.6}
.note:focus{border-color:var(--pink)}
.note-update-sub{font-size:12px;color:var(--muted);margin:8px 4px 0;font-weight:700}
.hint{text-align:center;color:var(--muted);font-size:12px;margin:12px 0}
.modal{position:fixed;inset:0;background:#4d3d4366;display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:100;backdrop-filter:blur(2px)}
.sheet{background:white;width:min(560px,100%);border-radius:28px;padding:20px;box-shadow:0 -8px 30px #0002;animation:slideUp .25s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet h3{margin:0 0 14px;font-size:18px;color:var(--text)}
.sheet label{font-size:12px;color:var(--muted);font-weight:700;display:block;margin-top:8px}
.sheet input,.sheet select{width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;margin:4px 0 10px;background:#fffdfd;outline:none}
.sheet input:focus,.sheet select:focus{border-color:var(--pink)}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{flex:1;border:0;border-radius:15px;padding:13px;font-weight:700;cursor:pointer}
.ok{background:var(--pink);color:white;box-shadow:0 4px 12px #ff7fa366}
.cancel{background:#f5eef1;color:var(--text)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#4d3d43;color:white;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 4px 12px #0003;z-index:1000;font-weight:700}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="honey-box" id="honeyBox" onclick="onLogoClick()" title="タップしてね">
    <div class="logo" id="logoIcon">🍯</div>
    <div class="bee bee1">🐝</div>
    <div class="bee bee2">🐝</div>
  </div>
  <h1 id="mainTitle">Shopping & Memo 💕</h1>
  <div class="sub" id="subTitle">MANAMI & TSUYOSHI v3.1</div>
</header>

<div id="home">
  <div class="tabs">
    <button class="tab active" data-filter="all" id="tabAll">🏠 ぜんぶ</button>
    <button class="tab" data-filter="shopping" id="tabShopping">🛒 買い物</button>
    <button class="tab" data-filter="memo" id="tabMemo">📝 メモ</button>
  </div>
  <div id="pages" class="pages"></div>
  <button class="addPage" id="btnAddPage" onclick="openPageModal()">＋ 新しいページを作る</button>
</div>

<div id="detail" class="hidden">
  <div class="topbar">
    <div><button class="back" id="btnBack" onclick="goHome()">← 戻る</button></div>
    <div class="topbar-row">
      <h2 id="detailTitleContainer">
        <span id="detailTitle"></span>
        <button class="edit-title-btn" onclick="openEditTitleModal()" title="タイトル変更">✏️</button>
      </h2>
      <div class="page-actions">
        <button class="icon-btn" onclick="confirmDeleteCurrentPage()" title="Delete">🗑️</button>
      </div>
    </div>
  </div>
  <div id="detailBody"></div>
</div>
</div>

<div id="modal" class="modal hidden">
 <div class="sheet">
  <h3 id="modalTitle">✨ 新しいページを追加</h3>
  <label id="lblPageName">ページタイトル</label>
  <input id="pageName" placeholder="例：COSTCO / メモ">
  <label id="lblPageType">種類</label>
  <select id="pageType">
    <option value="shopping" id="optShopping">🛒 買い物リスト</option>
    <option value="memo" id="optMemo">📝 覚え書き・メモ</option>
  </select>
  <div class="actions">
   <button class="cancel" id="btnCancel" onclick="closeModal()">やめる</button>
   <button class="ok" id="btnOk" onclick="createPage()">作る💕</button>
  </div>
 </div>
</div>

<!-- タイトル変更用モーダル -->
<div id="editModal" class="modal hidden">
 <div class="sheet">
  <h3>✏️ タイトルを変更</h3>
  <label>新しいタイトル</label>
  <input id="editPageNameInput">
  <div class="actions">
   <button class="cancel" onclick="closeEditModal()">やめる</button>
   <button class="ok" onclick="savePageName()">変更する💕</button>
  </div>
 </div>
</div>

<div id="toast" class="toast"></div>

<script>
// --- バージョン管理・自動更新ロジック ---
const CURRENT_VERSION = "v3.1";
// ※ここにネット上の最新バージョン情報（例: version.json など）や、自動更新先のURLを設定できます
const VERSION_CHECK_URL = ""; // 必要に応じて設定

let hasUpdateAvailable = false;

// ロゴ（🍯）がクリックされた時の挙動
function onLogoClick() {
  if (hasUpdateAvailable) {
    toast("✨ 最新版にアップデートしています...");
    setTimeout(() => {
      // キャッシュをクリアして最新のページを再読み込み
      window.location.reload(true);
    }, 1000);
  } else {
    toast("🍯 はにー＆つよし愛用中 💕 v3.1");
  }
}

// 起動時にアップデートを確認する関数
function checkForUpdates() {
  if(!VERSION_CHECK_URL) return;
  fetch(VERSION_CHECK_URL + "?t=" + Date.now())
    .then(res => res.json())
    .then(data => {
      if(data.version && data.version !== CURRENT_VERSION) {
        hasUpdateAvailable = true;
        // アイコンを 💩 に変更！
        document.getElementById("logoIcon").textContent = "💩";
        document.getElementById("subTitle").textContent = "✨ タップしてアップデートしてね！";
        toast("🚨 新しいバージョンがあります！アイコンをタップしてね💩");
      }
    })
    .catch(err => console.log("Update check skip:", err));
}

const userLang = (navigator.language || navigator.userLanguage || "ja").toLowerCase();
let currentLang = "ja";
if (userLang.startsWith("tl") || userLang.startsWith("fil")) {
  currentLang = "tl";
} else if (userLang.startsWith("en")) {
  currentLang = "en";
}

const lang = {
  ja: {
    tabAll: "🏠 ぜんぶ",
    tabShopping: "🛒 買い物",
    tabMemo: "📝 メモ",
    addPage: "＋ 新しいページを作る",
    emptyPages: "ページがまだないよ✨下のボタンから作ってね！",
    emptyItems: "まだアイテムがありません🛒",
    unreadCount: "件未購入",
    back: "← 戻る",
    itemPlaceholder: "商品名を入力…",
    addBtn: "追加",
    clearBtn: "チェック済を消去",
    hintShopping: "🟩 未購入 ⇄ ✅ 完了（タップで切替）",
    memoPlaceholder: "ここに自由に書いてね ✍️",
    modalTitle: "✨ 新しいページを追加",
    lblPageName: "ページタイトル",
    lblPageType: "種類",
    optShopping: "🛒 買い物リスト",
    optMemo: "📝 覚え書き・メモ",
    btnCancel: "やめる",
    btnOk: "作る💕",
    msgDelItem: "アイテムを消したよ🗑️",
    msgClear: "チェック済をクリアしたよ✨",
    msgDelPageConfirm: "を削除してもいい？",
    msgDelPage: "ページを削除したよ🗑️",
    msgCreatePage: "新しいページを作ったよ💕",
    msgNameChanged: "タイトルを変更したよ✨",
    updatedText: "最終更新: "
  },
  tl: {
    tabAll: "🏠 Lahat",
    tabShopping: "🛒 Pamimili",
    tabMemo: "📝 Memo",
    addPage: "＋ Gumawa ng bagong pahina",
    emptyPages: "Wala pang pahina✨ Gumawa sa ibaba!",
    emptyItems: "Wala pang item🛒",
    unreadCount: "hindi pa nabibili",
    back: "← Bumalik",
    itemPlaceholder: "Ilagay ang pangalan ng item...",
    addBtn: "Idagdag",
    clearBtn: "Burahin ang tapos na",
    hintShopping: "🟩 Hindi pa ⇄ ✅ Tapos na (I-tap para palitan)",
    memoPlaceholder: "Magsulat dito nang malaya ✍️",
    modalTitle: "✨ Magdagdag ng bagong pahina",
    lblPageName: "Pangalan ng Pahina",
    lblPageType: "Uri",
    optShopping: "🛒 Listahan ng Pamimili",
    optMemo: "📝 Tala / Memo",
    btnCancel: "Kanselahin",
    btnOk: "Gawin💕",
    msgDelItem: "Nabura na ang item🗑️",
    msgClear: "Na-clear na ang mga tapos na✨",
    msgDelPageConfirm: "Gusto mo bang burahin ang",
    msgDelPage: "Nabura na ang pahina🗑️",
    msgCreatePage: "Nagawa na ang bagong pahina💕",
    msgNameChanged: "Binago ang pangalan✨",
    updatedText: "Huling na-update: "
  },
  en: {
    tabAll: "🏠 All",
    tabShopping: "🛒 Shopping",
    tabMemo: "📝 Memo",
    addPage: "＋ Create new page",
    emptyPages: "No pages yet ✨ Create one below!",
    emptyItems: "No items yet 🛒",
    unreadCount: "left",
    back: "← Back",
    itemPlaceholder: "Enter item name...",
    addBtn: "Add",
    clearBtn: "Clear checked",
    hintShopping: "🟩 Unchecked ⇄ ✅ Completed (Tap to toggle)",
    memoPlaceholder: "Type your notes here ✍️",
    modalTitle: "✨ Add New Page",
    lblPageName: "Page Title",
    lblPageType: "Type",
    optShopping: "🛒 Shopping List",
    optMemo: "📝 Memo / Note",
    btnCancel: "Cancel",
    btnOk: "Create 💕",
    msgDelItem: "Item deleted 🗑️",
    msgClear: "Cleared checked items ✨",
    msgDelPageConfirm: "Are you sure you want to delete",
    msgDelPage: "Page deleted 🗑️",
    msgCreatePage: "New page created 💕",
    msgNameChanged: "Title updated ✨",
    updatedText: "Last updated: "
  }
};

const t = lang[currentLang];

document.getElementById("tabAll").textContent = t.tabAll;
document.getElementById("tabShopping").textContent = t.tabShopping;
document.getElementById("tabMemo").textContent = t.tabMemo;
document.getElementById("btnAddPage").textContent = t.addPage;
document.getElementById("btnBack").textContent = t.back;
document.getElementById("modalTitle").textContent = t.modalTitle;
document.getElementById("lblPageName").textContent = t.lblPageName;
document.getElementById("lblPageType").textContent = t.lblPageType;
document.getElementById("optShopping").textContent = t.optShopping;
document.getElementById("optMemo").textContent = t.optMemo;
document.getElementById("btnCancel").textContent = t.btnCancel;
document.getElementById("btnOk").textContent = t.btnOk;

const KEY="honeyAkoPrototypeV7_v2";
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzYoXH2p5ZZqPq3Aa_33aHig35ThCMI0l7B_UoAFdfaG54Fg8EOBZDo6y0FN27Qh-Ia/exec";

const seed={
 pages:[
  {id:"p1",name:currentLang==="tl"?"Costco":currentLang==="en"?"Costco":"COSTCO",type:"shopping",items:[
   {ja:currentLang==="tl"?"Karne ng Baka":currentLang==="en"?"Beef":"牛肉",checked:false},
   {ja:currentLang==="tl"?"Gatas":currentLang==="en"?"Milk":"牛乳",checked:false},
   {ja:currentLang==="tl"?"Itlog":currentLang==="en"?"Eggs":"卵",checked:true}
  ]},
  {id:"p2",name:currentLang==="tl"?"Mensahe para kay Honey":currentLang==="en"?"Note for Honey":"Honeyへの伝言",type:"memo",text:"",updatedAt:""},
 ]
};

let data=JSON.parse(localStorage.getItem(KEY)||"null")||seed;
let current=null, filter="all";

function save(){
  localStorage.setItem(KEY,JSON.stringify(data));
  syncToServer();
}

// クラウド（GAS）へ自動同期
function syncToServer(){
  if(!SCRIPT_URL) return;
  fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ pages: data.pages })
  }).catch(err => console.log("Sync error:", err));
}

// 起動時にクラウドから最新データを取得
function fetchFromServer(){
  if(!SCRIPT_URL) return;
  fetch(SCRIPT_URL + "?method=get")
    .then(res => res.json())
    .then(res => {
      if(res.status === "success" && res.pages && res.pages.length > 0){
        data.pages = res.pages;
        localStorage.setItem(KEY, JSON.stringify(data));
        renderPages();
        if(current){
          let updatedCurrent = data.pages.find(p => p.id === current.id);
          if(updatedCurrent){
            current = updatedCurrent;
            if(document.getElementById("detail").classList.contains("hidden") === false){
              renderDetail();
            }
          }
        }
      }
    })
    .catch(err => console.log("Fetch error:", err));
}

function toast(msg){let x=document.getElementById("toast");x.textContent=msg;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1400)}

function getFormattedDate(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  const h = String(date.getHours()).padStart(2, '0');
  const min = String(date.getMinutes()).padStart(2, '0');
  return `${y}.${m}.${d} ${h}:${min}`;
}

function renderPages(){
 const el=document.getElementById("pages"); el.innerHTML="";
 let list=data.pages.filter(p=>filter==="all"||p.type===filter);
 if(list.length===0){
   el.innerHTML=`<div style="text-align:center;color:var(--muted);padding:30px 0;font-size:14px;">${t.emptyPages}</div>`;
   return;
 }
 list.forEach(p=>{
  let subText = "";
  if(p.type==="shopping"){
    let count = p.items.filter(i=>!i.checked).length;
    subText = count + " " + t.unreadCount;
  } else {
    subText = p.updatedAt ? (t.updatedText + p.updatedAt) : (currentLang==="ja"?"まだ更新なし":currentLang==="tl"?"Wala pang update":"No updates yet");
  }
  let d=document.createElement("div");d.className="page";
  d.innerHTML=`<div class="emoji">${p.type==="shopping"?"🛒":"📝"}</div><div class="pbody"><div class="name">${esc(p.name)}</div><small>${subText}</small></div>`;
  d.onclick=()=>openPage(p.id);el.appendChild(d);
 });
}

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function openPage(id){
 current=data.pages.find(p=>p.id===id); if(!current)return;
 document.getElementById("home").classList.add("hidden");document.getElementById("detail").classList.remove("hidden");
 document.getElementById("detailTitle").textContent=current.name; renderDetail();
}

function renderDetail(){
 const b=document.getElementById("detailBody");
 if(current.type==="memo"){
  b.innerHTML=`<div class="card">
    <div id="updateTimeLabel" class="note-update-sub">${current.updatedAt ? (t.updatedText + current.updatedAt) : ""}</div>
    <textarea id="note" class="note" placeholder="${t.memoPlaceholder}" style="margin-top:8px">${esc(current.text||"")}</textarea>
  </div>`;
  document.getElementById("note").addEventListener("input",e=>{
    current.text=e.target.value;
    current.updatedAt=getFormattedDate();
    document.getElementById("updateTimeLabel").textContent = t.updatedText + current.updatedAt;
    save();
  });
  return;
}
 
 b.innerHTML=`<div class="card">
  <div class="addrow"><input id="itemInput" placeholder="${t.itemPlaceholder}"><button onclick="addItem()">${t.addBtn}</button></div>
 </div>
 
 <div class="list-header">
   <span>Shopping List</span>
   <button class="clear-btn" onclick="clearCheckedItems()">${t.clearBtn}</button>
 </div>
 <div id="items" class="items"></div>
 <div class="hint">${t.hintShopping}</div>`;
 const inp=document.getElementById("itemInput"); 
 inp.addEventListener("keydown",e=>{if(e.key==="Enter")addItem()});
 renderItems();
}

function renderItems(){
 const el=document.getElementById("items");el.innerHTML="";
 if(current.items.length===0){
   el.innerHTML=`<div style="text-align:center;color:var(--muted);padding:20px 0;font-size:13px;">${t.emptyItems}</div>`;
   return;
 }
 [...current.items].map((item, originalIndex)=>({...item, originalIndex}))
 .sort((a,b)=>a.checked - b.checked)
 .forEach((it)=>{
  let d=document.createElement("div");d.className="item "+(it.checked?"checked":"");
  d.innerHTML=`<div class="box" onclick="toggleItem(${it.originalIndex})">${it.checked?"✅":"🟩"}</div><div class="itemmain" onclick="toggleItem(${it.originalIndex})"><div class="itemname">${esc(it.ja)}</div></div><button class="item-del" onclick="deleteItem(${it.originalIndex})" title="Delete">✕</button>`;
  el.appendChild(d);
 });
}

function toggleItem(idx){
 current.items[idx].checked=!current.items[idx].checked;
 save(); renderItems(); renderPages();
}

function deleteItem(idx){
 current.items.splice(idx,1);
 save(); renderItems(); renderPages();
 toast(t.msgDelItem);
}

function clearCheckedItems(){
 current.items=current.items.filter(i=>!i.checked);
 save(); renderItems(); renderPages();
 toast(t.msgClear);
}

function addItem(){
 const input=document.getElementById("itemInput"), raw=input.value.trim(); if(!raw)return;
 current.items.unshift({ja:raw, checked:false});
 save();input.value="";renderItems();renderPages();
}

function confirmDeleteCurrentPage(){
 if(confirm(`「${current.name}」 ${t.msgDelPageConfirm}`)){
  data.pages=data.pages.filter(p=>p.id!==current.id);
  save(); goHome(); toast(t.msgDelPage);
 }
}

function goHome(){
 current=null;
 document.getElementById("detail").classList.add("hidden");
 document.getElementById("home").classList.remove("hidden");
 renderPages();
}

function openPageModal(){document.getElementById("modal").classList.remove("hidden");document.getElementById("pageName").focus()}
function closeModal(){document.getElementById("modal").classList.add("hidden")}

function createPage(){
 const name=document.getElementById("pageName").value.trim()||"New Page",type=document.getElementById("pageType").value;
 data.pages.push({id:"p"+Date.now(),name,type,...(type==="shopping"?{items:[]}:{text:"",updatedAt:""})});
 save(); closeModal(); document.getElementById("pageName").value=""; renderPages(); toast(t.msgCreatePage);
}

function openEditTitleModal(){
 document.getElementById("editPageNameInput").value = current.name;
 document.getElementById("editModal").classList.remove("hidden");
 document.getElementById("editPageNameInput").focus();
}
function closeEditModal(){
 document.getElementById("editModal").classList.add("hidden");
}
function savePageName(){
 const newName = document.getElementById("editPageNameInput").value.trim();
 if(!newName)return;
 current.name = newName;
 document.getElementById("detailTitle").textContent = newName;
 save();
 closeEditModal();
 renderPages();
 toast(t.msgNameChanged);
}

document.querySelectorAll(".tab").forEach(tBtn=>tBtn.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));tBtn.classList.add("active");filter=tBtn.dataset.filter;renderPages()});

// 起動時にサーバーから最新データを取得して反映
fetchFromServer();
checkForUpdates();
renderPages();
</script>
</body>
</html>
